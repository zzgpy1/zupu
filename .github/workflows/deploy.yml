name: Deploy to Cloudflare Workers

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ============================================================
      # 1. 部署后端 Worker (pure-genealogy-api)
      # ============================================================
      - name: Setup Node.js for Backend
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (Backend)
        working-directory: ./backend
        run: npm ci

      - name: Deploy Backend Worker
        working-directory: ./backend
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ============================================================
      # 2. 部署前端静态站点 (zupu-main Worker)
      # ============================================================
      - name: Setup Node.js for Frontend
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (Frontend)
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}

      - name: Deploy Frontend to Worker
        working-directory: ./frontend
        # 使用 wrangler deploy 部署静态资源
        # --assets 指定构建输出目录，--name 指定 Worker 名称（与 wrangler.toml 一致）
        run: npx wrangler deploy --assets=./dist --name=zupu-main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
