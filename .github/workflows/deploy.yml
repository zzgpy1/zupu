name: Deploy to Cloudflare Workers

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ============================================================
      # 1. 部署后端 API Worker
      # ============================================================
      - name: Setup Node.js for Backend
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (Backend)
        working-directory: ./backend
        run: npm ci

      - name: Deploy API Worker
        working-directory: ./backend
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ============================================================
      # 2. 部署前端静态站点到 Worker (zupu-main)
      # ============================================================
      - name: Setup Node.js for Frontend
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (Frontend)
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}

      # 部署前端静态资源到 Worker zupu-main
      - name: Deploy Frontend to Worker
        working-directory: ./frontend
        run: |
          # 创建一个临时的 Worker 脚本，用于托管静态文件
          echo 'export default { fetch(request) { return new Response("Not Found", { status: 404 }); } };' > ./worker.js
          npx wrangler deploy --name zupu-main --assets ./dist --main ./worker.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
